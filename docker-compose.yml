services:
  # ── llama.cpp server (CUDA) ──────────────────────────────────────
  llama-server:
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    container_name: llama-server
    restart: unless-stopped
    volumes:
      # MODELS_DIR lets the GGUF files live outside the repo (a data disk, an
      # NFS mount) without a machine-specific symlink checked into git.
      - ${MODELS_DIR:-./models}:/models:ro
      - ./templates:/templates:ro
    environment:
      # These are passed as CLI args by the entrypoint
      LLAMA_ARG_MODEL: ${MODEL_FILE:-/models/model.gguf}
      LLAMA_ARG_CTX_SIZE: ${CTX_SIZE:-4096}
      LLAMA_ARG_N_GPU_LAYERS: ${GPU_LAYERS:--1}
      # llama.cpp binds --parallel to LLAMA_ARG_N_PARALLEL; LLAMA_ARG_PARALLEL is
      # silently ignored, which left the slot count at its -1 (auto) default.
      LLAMA_ARG_N_PARALLEL: ${PARALLEL:-4}
      LLAMA_ARG_HOST: "0.0.0.0"
      LLAMA_ARG_PORT: "8080"
      # Quantize the KV cache to fit a larger context window in VRAM.
      LLAMA_ARG_CACHE_TYPE_K: ${CACHE_TYPE_K:-f16}
      LLAMA_ARG_CACHE_TYPE_V: ${CACHE_TYPE_V:-f16}
      # Use the chat template embedded in the GGUF so OpenAI-style tool calls
      # are parsed into structured `tool_calls` blocks (required for agentic clients).
      LLAMA_ARG_JINJA: "1"
      # To override the GGUF-embedded chat template, create docker-compose.override.yml
      # with:  services: { llama-server: { environment: { LLAMA_ARG_CHAT_TEMPLATE_FILE: /templates/your.jinja } } }
      # (templates/ is mounted read-only at /templates inside the container)
    # Expose the raw HTTP port only on localhost (not to the network).
    # For network access, use the nginx HTTPS proxy below.
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - llm-net

  # ── nginx TLS reverse proxy ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: llama-proxy
    restart: unless-stopped
    depends_on:
      llama-server:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "${HTTPS_PORT:-8443}:443"
    networks:
      - llm-net

networks:
  llm-net:
    driver: bridge
