load_module modules/ngx_http_js_module.so;

worker_processes auto;

# Read by nginx/router.js (see docker-compose.yml).
env SIDECAR_MODEL_NAMES;
env SIDECAR_UPSTREAM;
env SIDECAR_TLS_NAME;

events {
    worker_connections 256;
}

http {
    js_path   /etc/nginx/njs;
    js_import router from router.js;

    # ── Logging ────────────────────────────────────────────────
    # CN of the verified client certificate, for per-client accounting.
    map $ssl_client_s_dn $ssl_client_cn {
        default "";
        ~(^|,)CN=(?<cn>[^,]+) $cn;
    }

    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"client":"$remote_addr",'
        '"client_cn":"$ssl_client_cn",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"query":"$args",'
        '"status":$status,'
        '"request_length":$request_length,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_header_time":"$upstream_header_time",'
        '"upstream_status":"$upstream_status",'
        '"upstream_addr":"$upstream_addr",'
        '"model":"$routed_model",'
        '"route":"$route",'
        '"usage_input":"$usage_input",'
        '"usage_output":"$usage_output",'
        '"usage_cache_read":"$usage_cache_read",'
        '"usage_cache_creation":"$usage_cache_creation",'
        '"usage_prompt_ms":"$usage_prompt_ms",'
        '"usage_predicted_ms":"$usage_predicted_ms",'
        '"traceparent":"$http_traceparent",'
        '"user_agent":"$http_user_agent"'
    '}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Plain-HTTP status for the Prometheus exporter (not published) ─
    server {
        listen 8081;
        access_log off;
        location /stub_status {
            stub_status;
        }
    }

    # ── Upstream: llama.cpp server ─────────────────────────────
    upstream llama {
        server llama-server:8080;
    }

    # ── Redirect HTTP → HTTPS (optional, only if port 80 mapped) ─
    # server {
    #     listen 80;
    #     return 301 https://$host$request_uri;
    # }

    # ── HTTPS server ───────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;
        absolute_redirect off;

        # TLS certificates (mounted from ./certs/)
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Mutual TLS: require a client certificate signed by the local CA
        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client on;

        # Chat completions at large context sizes exceed nginx's 1m default;
        # agent requests routinely exceed the 16k buffer default and would
        # otherwise be spooled to disk with a warning per request.
        client_max_body_size    32m;
        client_body_buffer_size 1m;

        # Modern TLS settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Proxy defaults (inherited by the locations below) ──
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE support (streaming completions)
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;

        # Long timeouts for slow inference
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 60s;

        # ── Everything not routed by model goes to llama.cpp ───
        location / {
            proxy_pass http://llama;
        }

        # ── Inference endpoints: routed by the `model` body field ─
        # nginx/router.js sends SIDECAR_MODEL_NAMES to SIDECAR_UPSTREAM (a
        # second instance of this stack, e.g. a Jetson) and every other
        # model to the local llama.cpp; requests never leave the deployment.
        # The body must stay in memory for the router to read it.
        location ~ ^/v1/(messages|messages/count_tokens|chat/completions|completions|embeddings)$ {
            client_body_buffer_size 32m;
            js_content router.route;
        }

        # Token usage and llama.cpp timings reported by the backend, observed
        # by router.usage on the inference legs without altering the bytes.
        set $usage_mode           "";
        set $usage_buf            "";
        set $usage_input          "";
        set $usage_output         "";
        set $usage_cache_read     "";
        set $usage_cache_creation "";
        set $usage_prompt_ms      "";
        set $usage_predicted_ms   "";

        location @llama {
            proxy_pass     http://llama;
            js_body_filter router.usage;
        }

        set $routed_model         "";
        set $route                "";
        set $sidecar_upstream     "";
        set $sidecar_host         "";
        set $sidecar_ssl_name     "";
        # ── Sidecar: another instance of this stack behind its own mTLS ─
        # Client credentials come from SIDECAR_CERTS_DIR (docker-compose.yml).
        # The cert paths are variables so they are read per request: a host
        # without sidecar credentials must still be able to start nginx.
        set $sidecar_cert     /etc/nginx/sidecar/client.crt;
        set $sidecar_cert_key /etc/nginx/sidecar/client.key;
        location @sidecar {
            resolver 127.0.0.11 valid=30s ipv6=off;
            js_body_filter                router.usage;
            proxy_pass                    $sidecar_upstream;
            proxy_set_header Host         $sidecar_host;
            proxy_set_header Connection   '';
            proxy_ssl_server_name         on;
            proxy_ssl_name                $sidecar_ssl_name;
            proxy_ssl_protocols           TLSv1.2 TLSv1.3;
            proxy_ssl_certificate         $sidecar_cert;
            proxy_ssl_certificate_key     $sidecar_cert_key;
            proxy_ssl_verify              on;
            proxy_ssl_verify_depth        3;
            proxy_ssl_trusted_certificate /etc/nginx/sidecar/ca.crt;
        }

        # ── Sidecar metrics for a remote Prometheus (see README) ─
        # Same mTLS vhost; resolved at request time so nginx serves the
        # other locations when the exporters (docker-compose.metrics.yml)
        # are not running (then: 502). Scrapes are frequent: not logged.
        location = /metrics/llama {
            access_log off;
            resolver 127.0.0.11 valid=10s;
            set $metrics_llama http://llama-server:8080/metrics;
            proxy_pass $metrics_llama;
        }
        location = /metrics/node {
            access_log off;
            resolver 127.0.0.11 valid=10s;
            set $metrics_node http://sidecar-node-exporter:9100/metrics;
            proxy_pass $metrics_node;
        }
        location = /metrics/nginx {
            access_log off;
            resolver 127.0.0.11 valid=10s;
            set $metrics_nginx http://sidecar-nginx-exporter:9113/metrics;
            proxy_pass $metrics_nginx;
        }
        location = /metrics/tegra {
            access_log off;
            resolver 127.0.0.11 valid=10s;
            set $metrics_tegra http://sidecar-tegra-exporter:9101/metrics;
            proxy_pass $metrics_tegra;
        }

        # ── OTLP ingest (observability add-on, see README) ─────
        # Claude Code sessions post their OpenTelemetry metrics, events and
        # traces here; Alloy fans them out to Prometheus, Loki and Tempo.
        # Resolved at request time like /grafana/; exports are periodic, so
        # they are not access-logged.
        location /otlp/ {
            access_log off;
            resolver 127.0.0.11 valid=10s;
            set $otlp http://alloy:4318;
            rewrite ^/otlp/(.*)$ /$1 break;
            proxy_pass $otlp;
        }

        # ── Grafana (observability add-on) ─────────────────────
        # Resolved at request time so nginx starts even when the
        # observability stack is not running (then: 502).
        location /grafana/ {
            resolver 127.0.0.11 valid=10s;
            set $grafana http://grafana:3000;
            proxy_pass         $grafana;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
        }
    }
}
