worker_processes auto;

events {
    worker_connections 256;
}

http {
    # ── Logging ────────────────────────────────────────────────
    # CN of the verified client certificate, for per-client accounting.
    map $ssl_client_s_dn $ssl_client_cn {
        default "";
        ~(^|,)CN=(?<cn>[^,]+) $cn;
    }

    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"client":"$remote_addr",'
        '"client_cn":"$ssl_client_cn",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"query":"$args",'
        '"status":$status,'
        '"request_length":$request_length,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"upstream_status":"$upstream_status",'
        '"user_agent":"$http_user_agent"'
    '}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Plain-HTTP status for the Prometheus exporter (not published) ─
    server {
        listen 8081;
        access_log off;
        location /stub_status {
            stub_status;
        }
    }

    # ── Upstream: llama.cpp server ─────────────────────────────
    upstream llama {
        server llama-server:8080;
    }

    # ── Redirect HTTP → HTTPS (optional, only if port 80 mapped) ─
    # server {
    #     listen 80;
    #     return 301 https://$host$request_uri;
    # }

    # ── HTTPS server ───────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;
        absolute_redirect off;

        # TLS certificates (mounted from ./certs/)
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Mutual TLS: require a client certificate signed by the local CA
        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client on;

        # Chat completions at large context sizes exceed nginx's 1m default;
        # agent requests routinely exceed the 16k buffer default and would
        # otherwise be spooled to disk with a warning per request.
        client_max_body_size    32m;
        client_body_buffer_size 1m;

        # Modern TLS settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Proxy all requests to llama.cpp ────────────────────
        location / {
            proxy_pass         http://llama;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # SSE support (streaming completions)
            proxy_set_header   Connection        '';
            proxy_buffering    off;
            proxy_cache        off;
            chunked_transfer_encoding on;

            # Long timeouts for slow inference
            proxy_read_timeout    600s;
            proxy_send_timeout    600s;
            proxy_connect_timeout 60s;
        }

        # ── Grafana (observability add-on) ─────────────────────
        # Resolved at request time so nginx starts even when the
        # observability stack is not running (then: 502).
        location /grafana/ {
            resolver 127.0.0.11 valid=10s;
            set $grafana http://grafana:3000;
            proxy_pass         $grafana;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
        }
    }
}
