worker_processes auto;

events {
    worker_connections 256;
}

http {
    # ── Logging ────────────────────────────────────────────────
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # ── Upstream: llama.cpp server ─────────────────────────────
    upstream llama {
        server llama-server:8080;
    }

    # ── Redirect HTTP → HTTPS (optional, only if port 80 mapped) ─
    # server {
    #     listen 80;
    #     return 301 https://$host$request_uri;
    # }

    # ── HTTPS server ───────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        # TLS certificates (mounted from ./certs/)
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Modern TLS settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Proxy all requests to llama.cpp ────────────────────
        location / {
            proxy_pass         http://llama;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # SSE support (streaming completions)
            proxy_set_header   Connection        '';
            proxy_buffering    off;
            proxy_cache        off;
            chunked_transfer_encoding on;

            # Long timeouts for slow inference
            proxy_read_timeout    600s;
            proxy_send_timeout    600s;
            proxy_connect_timeout 60s;
        }

        # ── Health check endpoint (no TLS overhead for monitoring) ─
        location /health {
            proxy_pass http://llama/health;
        }
    }
}
