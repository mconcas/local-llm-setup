# Jetson Orin (JetPack 6) override: replaces the upstream image, which does
# not run on the Tegra iGPU, with the one built from jetson/Dockerfile by
# .github/workflows/jetson-image.yml and published on ghcr.io. The tag is the
# llama.cpp build and must match the x86 default in docker-compose.yml.
# Activate with COMPOSE_FILE=docker-compose.yml:docker-compose.jetson.yml in
# .env, or pass both files with -f.
services:
  llama-server:
    image: ${LLAMA_IMAGE:-ghcr.io/mconcas/local-llm-setup/llama-server-jetson:b10818}
    environment:
      # Unified memory: an mmap-loaded GGUF keeps a second copy of the weights
      # in page cache that the Tegra allocator cannot reclaim, so the KV cache
      # allocation fails. Direct I/O streams the file into the CUDA buffers.
      LLAMA_ARG_LOAD_MODE: dio
