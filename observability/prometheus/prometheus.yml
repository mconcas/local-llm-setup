global:
  scrape_interval: 15s
  evaluation_interval: 15s

# OTLP metrics pushed by Claude Code sessions through Alloy
# (--web.enable-otlp-receiver in docker-compose.observability.yml).
otlp:
  promote_resource_attributes:
    - service.name
    - service.version
    - host.name
    - gen_ai.provider.name

storage:
  tsdb:
    out_of_order_time_window: 30m

# Deployment-specific scrape jobs (e.g. a sidecar host), gitignored.
scrape_config_files:
  - /etc/prometheus/scrape.d/*.yml

scrape_configs:
  - job_name: llama-server
    static_configs:
      - targets: ["llama-server:8080"]

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: dcgm
    static_configs:
      - targets: ["dcgm-exporter:9400"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
